name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-quality-gate:
    name: web-quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnostic baseline gate
        run: npm run ci:diagnostic-baseline
      - name: Critical regression suite
        run: npm run ci:critical-regressions
      - name: Build web bundle
        run: npm run build
      - name: Startup and checkout source marker assertions
        run: node scripts/migration/run-g50b-native-startup-hotfix-tests.mjs && node scripts/migration/run-g49a-checkout-processing-error-boundary-tests.mjs
      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "(sk_live_|sk_test_|pk_live_[A-Za-z0-9]{12,}|pk_test_[A-Za-z0-9]{12,}|whsec_|client_secret[=:][A-Za-z0-9_\-]+|Bearer [A-Za-z0-9._-]+)" src scripts docs config .github; then
            exit 1
          fi
      - name: Bundle size measurement
        run: du -ah dist | sort -h | tail -30
      - name: Build must not dirty tracked files
        run: git diff --exit-code

  release-policy-gate:
    name: release-policy-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify open release-critical PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:verify-open-critical-prs
      - name: Verify PR source policy
        if: github.event_name == 'pull_request'
        run: node scripts/release/verify-native-release-source.mjs --policy-mode pr --approved-commit ${{ github.sha }}
      - name: Verify main source policy
        if: github.event_name == 'push'
        run: npm run release:verify-source
