name: Native Release Gate

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact approved origin/main commit for a native release verification run
        required: true
        type: string
      base44_deployment_id:
        description: Base44 deployment identifier observed live for this commit
        required: true
        type: string
      base44_entry_asset:
        description: Live Base44 entry asset recorded after deployment (for example index-AbCd1234.js)
        required: true
        type: string
      base44_commit:
        description: Full Git commit used by the Base44 site deployment
        required: true
        type: string
      base44_observed_at_utc:
        description: ISO timestamp when the live Base44 asset was verified
        required: true
        type: string
      appflow_build_id:
        description: Active Appflow Production Web build ID
        required: true
        type: string
      appflow_commit:
        description: Full Git commit shown by the active Appflow Production build
        required: true
        type: string
      appflow_observed_at_utc:
        description: ISO timestamp when Appflow Production was verified active
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: native-release-gate-${{ github.workflow }}-${{ github.event.inputs.approved_commit }}
  cancel-in-progress: false

jobs:
  native-release-gate:
    name: native-quality-gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.approved_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: mkdir -p release-evidence
      - run: npm ci
      - name: Verify canonical release source before build
        run: node scripts/release/verify-native-release-source.mjs --policy-mode release --approved-commit ${{ inputs.approved_commit }} --out release-evidence/source-policy.json
      - name: Secret scan
        run: npm run ci:secret-scan -- --out release-evidence/secret-scan.json
      - name: Diagnostic baseline gate
        run: npm run ci:diagnostic-baseline -- --out release-evidence/diagnostics.json
      - name: Critical regression suite
        run: npm run ci:critical-regressions -- --out release-evidence/critical-regressions.json
      - name: Verify open release-critical PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:verify-open-critical-prs -- --out release-evidence/critical-prs.json
      - name: Build web bundle
        run: npm run build
      - name: Verify Base44 and Appflow deployment provenance
        env:
          RELEASE_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          RELEASE_BASE44_DEPLOYMENT_ID: ${{ inputs.base44_deployment_id }}
          RELEASE_BASE44_COMMIT: ${{ inputs.base44_commit }}
          RELEASE_BASE44_ENTRY_ASSET: ${{ inputs.base44_entry_asset }}
          RELEASE_BASE44_OBSERVED_AT_UTC: ${{ inputs.base44_observed_at_utc }}
          RELEASE_APPFLOW_BUILD_ID: ${{ inputs.appflow_build_id }}
          RELEASE_APPFLOW_COMMIT: ${{ inputs.appflow_commit }}
          RELEASE_APPFLOW_STATUS: active
          RELEASE_APPFLOW_OBSERVED_AT_UTC: ${{ inputs.appflow_observed_at_utc }}
        run: npm run release:verify-deployment-provenance -- --out release-evidence/deployment-provenance.json
      - name: Capacitor sync iOS
        run: npx cap sync ios
      - name: Verify post-build source mutation policy
        run: node scripts/release/verify-native-release-source.mjs --skip-fetch --phase postbuild --policy-mode release --approved-commit ${{ inputs.approved_commit }} --out release-evidence/source-policy.json
      - name: Verify Web/native bundle parity, markers, and budgets
        run: npm run release:verify-bundle-parity -- --out release-evidence/bundle-parity.json
      - name: iOS Release simulator build
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Record simulator build evidence
        run: node scripts/release/write-gate-evidence.mjs --suite g50c-ios-release-simulator-build --out release-evidence/simulator-build.json
      - name: Generate release manifest
        run: npm run release:generate-manifest -- --require-deployment-provenance --evidence-dir release-evidence --out release-evidence/native-release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-release-manifest
          path: release-evidence/*.json
